<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respiro — Furniture & Object Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=EB+Garamond:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #050608; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #sky { transition: opacity 1.4s; }
  #front { z-index: 3; pointer-events: none; }
  body { font: 400 16px/1.6 'EB Garamond', Georgia, serif; color: #e8ecf0; }
  a, button { color: inherit; text-decoration: none; font: inherit; letter-spacing: inherit;
    text-transform: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  @media (hover: hover) { a:hover, button:hover { color: #7fb8e6; } }
  .glow { text-shadow: 0 0 6px #050608, 0 0 2px #050608; }

  .bar { position: fixed; z-index: 5; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    padding: 20px 24px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
  .bar nav { display: flex; gap: 28px; }
  .bar { pointer-events: none; }
  .bar a, .bar button { pointer-events: auto; }

  #stage { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; pointer-events: none; }
  .obj img, .obj svg { display: block; width: 100%; height: auto; max-height: 46vh; object-fit: contain; }
  .obj { width: min(42vw, 600px); cursor: pointer; pointer-events: auto;
    transition: transform 1s cubic-bezier(.3, .6, .2, 1), opacity 1s, filter 1s; }
  .obj.far { transform: scale(.55); opacity: 0; filter: blur(8px); }
  .obj svg { display: block; width: 100%; height: auto; overflow: visible; }

  .caption { position: fixed; z-index: 5; left: 0; right: 0; bottom: 9vh; text-align: center;
    font-size: 12px; letter-spacing: .16em; text-transform: uppercase; transition: opacity .8s; }
  .caption .name { font-size: 15px; letter-spacing: .22em; margin: 6px 0; }
  .caption .kind, .caption .count { color: #8a929b; }
  .caption .nav { display: flex; justify-content: center; gap: 36px; margin-top: 10px; }

  /* One thing at a time: whatever is leaving fades out quickly first,
     and what arrives fades in only once the lines have moved. */
  #door { position: fixed; inset: 0; z-index: 4; overflow-y: auto; touch-action: pan-y;
    opacity: 0; pointer-events: none; transition: opacity .35s; }
  #door.open { opacity: 1; pointer-events: auto; transition: opacity .8s .7s; }
  #stage, #ui, .bar nav { transition: opacity .8s .7s; }
  body.reading #stage, body.reading #ui, body.reading .bar nav { opacity: 0; pointer-events: none; transition: opacity .35s; }
  body.reading .bar nav button { pointer-events: none; }
  /* The door uses the whole width of the screen: a two-column grid where
     text, specs and wide images span both columns and photos and drawings
     sit side by side. On phones everything falls into a single column. */
  #door article { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 0 4vw;
    width: min(100% - 16vw, 1240px); margin: 0 auto; padding: 25vh 0 28vh; font-size: clamp(15px, 1.05vw, 18px); }
  #door article > * { grid-column: 1 / -1; }
  #door .kind { color: #8a929b; font-size: .72em; letter-spacing: .16em; text-transform: uppercase; }
  #door h2 { font-weight: 300; font-size: clamp(26px, 3vw, 48px); line-height: 1.1; letter-spacing: .03em; margin: 6px 0 3vh; }
  #door p { margin: 0 0 1.2em; max-width: 620px; }
  #door p.long { max-width: none; column-count: 2; column-gap: 4vw; }
  #door figure { margin: 4vh 0; }
  #door figure img, #door figure svg { display: block; width: 100%; height: auto; }
  #door article > figure:first-of-type img, #door article > figure:first-of-type svg {
    max-height: 48vh; width: auto; max-width: 100%; margin: 0 auto; }
  #door article > figure.photo, #door article > figure.drawing { grid-column: auto; }
  #door figure.photo img, #door figure.wide img { max-height: 46vh; object-fit: contain; }
  #door figure.drawing img { opacity: .85; }
  #door article > figure.drawing:not(.wide) { grid-column: 1 / -1; }
  #door article > figure.drawing:not(.wide) img { max-height: 55vh; width: auto; max-width: 100%; margin: 0 auto; }
  #door figure.photo img {
    --fade: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent), linear-gradient(transparent, #000 6%, #000 94%, transparent);
    -webkit-mask-image: var(--fade); -webkit-mask-composite: source-in; mask-image: var(--fade); mask-composite: intersect; }
  #door figcaption { color: #8a929b; font-size: .65em; letter-spacing: .12em; text-transform: uppercase; margin-top: 10px; }
  #door h3 { font-weight: 400; font-size: .72em; letter-spacing: .16em; text-transform: uppercase; color: #8a929b; margin: 8vh 0 2vh; }
  #door dl { display: grid; grid-template-rows: auto auto; grid-auto-flow: column; grid-auto-columns: 1fr;
    gap: 6px 3vw; margin: 4vh 0; padding: 3vh 0; border-top: 1px solid rgba(232,236,240,.15); border-bottom: 1px solid rgba(232,236,240,.15); }
  #door dt { color: #8a929b; font-size: .72em; letter-spacing: .12em; text-transform: uppercase; }
  #door dd { margin: 0; }
  #door .soon { color: #8a929b; letter-spacing: .12em; text-transform: uppercase; font-size: .72em; margin-top: 6vh; }
  #door a[href^="mailto"] { font-size: clamp(18px, 2vw, 30px); font-weight: 300; }
  /* Text and images fade in as they rise past the lower edge of the
     clearing and fade out toward the upper one, like breath on glass. */
  #door { --fade: linear-gradient(transparent 9vh, #000 25vh, #000 75vh, transparent 91vh);
    -webkit-mask-image: var(--fade); mask-image: var(--fade); }
  #door article { filter: blur(10px); transform: translateY(2vh); transition: filter .35s, transform .35s; }
  #door.open article { filter: none; transform: none; transition: filter 1.2s .7s, transform 1.2s .7s; }
  #veil { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: rgba(5, 6, 8, .55);
    opacity: 0; transition: opacity .35s; }
  body.reading #veil { opacity: 1; transition: opacity .8s .7s; }
  .close { position: fixed; top: 16px; right: 24px; z-index: 6; opacity: 0; pointer-events: none; transition: opacity .35s; }
  body.reading .close { opacity: 1; pointer-events: auto; transition: opacity .8s .7s; }
  .close { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
  .lang { margin-left: 22px; color: #8a929b; }
  .lang .on { color: #e8ecf0; }
  @media (max-width: 700px) { .bar { padding: 18px 16px; letter-spacing: .1em; } .bar nav { gap: 16px; } .lang { margin-left: 12px; } .obj { width: 78vw; } .caption { bottom: 7vh; } #door { --fade: linear-gradient(transparent 6vh, #000 18vh, #000 82vh, transparent 94vh); } #door article { grid-template-columns: 1fr; width: calc(100% - 32px); padding-top: 18vh; padding-bottom: 22vh; font-size: 16px; } #door p, #door p.long { column-count: 1; max-width: none; } #door dl { grid-auto-flow: row; grid-template-rows: none; grid-template-columns: max-content 1fr; } }
  /* EB Garamond throughout, Cormorant Garamond for the titles. */
  #door h2, .caption .name { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; }
  #door h2 { font-size: clamp(36px, 4.2vw, 68px); letter-spacing: .01em; }
  .caption .name { font-size: 26px; letter-spacing: .08em; text-transform: none; }
  #door p { font-size: 1.12em; line-height: 1.55; }
</style>

<canvas id="sky"></canvas>
<canvas id="scene"></canvas>
<div id="stage"></div>
<canvas id="front"></canvas>
<header class="bar glow"><span><a href="#" id="home">Respiro</a><span class="lang"><button data-lang="en">EN</button> / <button data-lang="it">IT</button></span></span><nav><button data-page="about" data-t="about"></button><button data-page="contact" data-t="contact"></button></nav></header>
<div id="ui"><div class="caption glow" id="caption"></div></div>
<div class="veil" id="veil"></div><div id="door"><article class="glow" id="page"></article></div><button class="close glow" id="close">Close</button>

<script>
const sky = document.getElementById('sky');
const scene = document.getElementById('scene');
const front = document.getElementById('front');
const backCtx = scene.getContext('2d');
const frontCtx = front.getContext('2d');
let ctx = backCtx;

// Phones get a lighter scene with fewer lines.
const COMPACT = innerWidth < 700;
const LINES = COMPACT ? 10 : 16;
const STRANDS = 5;
const STEP = 10;
const SKY_STEP = 6;
const BREATH = 14000;
const VISCOSITY = 1200;
const TAU = Math.PI * 2;
const INK = '#e8ecf0';
const DARK = '#050608';

// Quality steps used when the device can't keep up: lower the scene's
// resolution, then also halve the frame rate. Resolution never drops below
// one pixel per CSS pixel, so ordinary screens only ever lose frame rate
// and never get blurry.
const LEVELS = [
  { res: 1, every: 1 },
  { res: 0.75, every: 1 },
  { res: 0.75, every: 2 },
  { res: 0.5, every: 2 },
];

let w, h, dpr, cols, lines, order;
let level = 0, load = 0, frames = 0, last = 0;

function resize() {
  dpr = devicePixelRatio || 1;
  w = innerWidth;
  h = innerHeight;
  cols = Math.ceil(w / STEP) + 2;
  for (const l of lines) {
    l.free = new Float32Array(cols);
    l.ys = new Float32Array(cols);
    l.v = new Float32Array(cols);
    l.sw = new Float32Array(cols);
    l.fresh = true;
  }
  fit();
  engraveSky();
}

function fit() {
  const r = Math.max(1, Math.min(dpr, 2) * LEVELS[level].res);
  for (const c of [scene, front]) {
    c.width = Math.round(w * r);
    c.height = Math.round(h * r);
    c.getContext('2d').setTransform(r, 0, 0, r, 0, 0);
  }
}

const smooth = (a, b, v) => {
  const t = Math.min(1, Math.max(0, (v - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

function field() {
  const perm = new Uint8Array(256).map(() => Math.random() * 256);
  const hash = (i, j) => perm[(perm[i & 255] + j) & 255] / 255;
  const lx = w * (0.5 + Math.random() * 0.25), ly = -h * 0.08;
  const r = Math.max(w, h) * 0.6;
  const scale = Math.max(w, h) / 1440;

  const noise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const u = smooth(0, 1, x - xi), v = smooth(0, 1, y - yi);
    const top = hash(xi, yi) + (hash(xi + 1, yi) - hash(xi, yi)) * u;
    const bottom = hash(xi, yi + 1) + (hash(xi + 1, yi + 1) - hash(xi, yi + 1)) * u;
    return (top + (bottom - top) * v) * 2 - 1;
  };

  const cloud = (x, y, octaves = 5) => {
    let c = 0, f = 1 / (450 * scale), a = 1;
    for (let i = 0; i < octaves; i++) {
      c += a * noise(x * f, y * f * 1.8);
      f *= 2;
      a *= 0.5;
    }
    return c / 1.4;
  };

  const glow = (x, y) => Math.exp(-((x - lx) ** 2 + (y - ly) ** 2) / (r * r));

  // Light comes from above: a cloud is bright where its surface rises
  // toward the light and dark on its underside.
  const tone = (x, y) => {
    const c = cloud(x, y), g = glow(x, y);
    const mass = smooth(0, 0.35, c);
    const rim = Math.max(-1, Math.min(1, (c - cloud(x, y - 24 * scale)) * 3));
    const open = 0.05 + 0.45 * g;
    const lit = 0.45 + 0.45 * rim + 0.2 * g;
    const t = (open + (lit - open) * mass) * (1 - 0.5 * y / h);
    return Math.min(1, Math.max(0, t)) ** 1.7;
  };

  return { scale, cloud, tone };
}

// Adds one cut to the current path. pts holds x, y, half-width triples;
// where the cut gets too thin to carve it breaks, like a burin lifting.
function cut(s, pts, nx, ny) {
  let run = [];
  const flush = () => {
    if (run.length >= 6) {
      s.moveTo(run[0] - nx * run[2], run[1] - ny * run[2]);
      for (let k = 3; k < run.length; k += 3) {
        s.lineTo(run[k] - nx * run[k + 2], run[k + 1] - ny * run[k + 2]);
      }
      for (let k = run.length - 3; k >= 0; k -= 3) {
        s.lineTo(run[k] + nx * run[k + 2], run[k + 1] + ny * run[k + 2]);
      }
      s.closePath();
    }
    run = [];
  };
  for (let k = 0; k < pts.length; k += 3) {
    if (pts[k + 2] < 0.03) flush();
    else run.push(pts[k], pts[k + 1], pts[k + 2]);
  }
  flush();
}

// The sky is carved the way Doré's engravers worked: tone comes from the
// width of each cut, the cuts bend over the clouds, and a second set
// crosses them in the half-tones. It lives on its own canvas and is drawn
// once, so the browser composites it for free on every frame.
function engraveSky() {
  sky.width = w * dpr;
  sky.height = h * dpr;
  const s = sky.getContext('2d');
  s.setTransform(dpr, 0, 0, dpr, 0, 0);
  s.fillStyle = DARK;
  s.fillRect(0, 0, w, h);
  s.fillStyle = INK;
  s.globalAlpha = 0.4;

  const f = field();
  const grain = () => 0.9 + Math.random() * 0.2;
  const gap = Math.max(1.6, 3 / Math.sqrt(dpr));
  const fine = gap / 3 * (COMPACT ? 1.8 : 1);

  s.beginPath();
  for (let y = -30; y < h + 30; y += gap) {
    const pts = [];
    for (let x = 0; x <= w + SKY_STEP; x += SKY_STEP) {
      const yy = y + f.cloud(x, y, 2) * 26 * f.scale;
      pts.push(x, yy, (0.08 + 0.7 * f.tone(x, yy)) * fine * grain());
    }
    cut(s, pts, 0, 1);
  }
  s.fill();

  if (COMPACT) return;
  const slope = Math.tan(-0.35), len = Math.hypot(1, slope);
  s.beginPath();
  for (let c = 0; c < h - slope * w; c += gap * 1.4) {
    const pts = [];
    for (let x = 0; x <= w + SKY_STEP; x += SKY_STEP) {
      const y = c + x * slope;
      const t = y < -10 || y > h + 10 ? 0 : f.tone(x, y);
      const band = Math.max(0, 1 - Math.abs(t - 0.38) / 0.15);
      pts.push(x, y, band * 0.25 * fine * (1 - y / h) * grain());
    }
    cut(s, pts, -slope / len, 1 / len);
  }
  s.fill();
}

function waves(scale) {
  const list = [];
  for (let i = 1; i <= 4; i++) {
    list.push({
      freq: (0.5 + Math.random()) * i * scale * STEP,
      speed: (Math.random() - 0.5) * i * 0.00012,
      phase: Math.random() * TAU,
      amp: 1 / i,
    });
  }
  return list;
}

// Writes the sum of the waves into out, moving each value toward it by k.
// Instead of calling sin for every point, each wave is a unit vector that
// gets rotated by a fixed angle per step: two multiplies instead of a sin.
const rot = new Float64Array(16);

function sweep(list, t, base, amp, out, k) {
  for (let i = 0; i < 4; i++) {
    const v = list[i], p = t * v.speed + v.phase;
    rot[i * 4] = Math.sin(p);
    rot[i * 4 + 1] = Math.cos(p);
    rot[i * 4 + 2] = Math.sin(v.freq);
    rot[i * 4 + 3] = Math.cos(v.freq);
  }
  for (let j = 0; j < cols; j++) {
    let y = 0;
    for (let i = 0; i < 16; i += 4) {
      const s = rot[i], c = rot[i + 1];
      y += list[i >> 2].amp * s;
      rot[i] = s * rot[i + 3] + c * rot[i + 2];
      rot[i + 1] = c * rot[i + 3] - s * rot[i + 2];
    }
    out[j] += (base + amp * y - out[j]) * k;
  }
}

// depth runs from 0 (far) to 1 (near) and drifts slowly over time. Far
// lines are thinner, fainter and slower, which gives the scene parallax;
// each line keeps its own clock so a change of pace never makes it jump.
function line() {
  return {
    period: 20000 + Math.random() * 20000,
    phase: Math.random() * TAU,
    depth: 0,
    clock: Math.random() * 1e5,
    path: waves(0.001),
    swell: waves(0.004),
    fresh: true,
  };
}

// Each point eases toward where the wave wants it, so the lines move
// with the drag of something heavy in water.
function update(t, dt) {
  const breath = 0.55 + 0.45 * Math.sin(t / BREATH * TAU);
  const band = COMPACT ? Math.min(h, w * 1.3) : h;
  const gap = band / (LINES + 1);
  const ease = 1 - Math.exp(-dt / VISCOSITY);

  for (let i = 0; i < LINES; i++) {
    const l = lines[i];
    l.depth = 0.5 + 0.5 * Math.sin(t / l.period * TAU + l.phase);
    l.clock += dt * (0.4 + 0.6 * l.depth);

    const base = h / 2 + (i - (LINES - 1) / 2) * gap * breath * (0.3 + 1.1 * l.depth);
    sweep(l.path, l.clock, base, gap * (0.2 + 0.9 * l.depth), l.free, l.fresh ? 1 : ease);
    if (l.depth >= 0.55) sweep(l.swell, t, 0, 1, l.sw, 1);
  }
  bend(dt);
  for (const l of lines) l.fresh = false;
}

// The visitor's hand: a mouse over the page, or a finger on the screen.
// Lines near it are gathered toward it, so the bond is something the
// visitor makes. Everything trails behind it, as if moved through water.
// A still mouse counts as gone: most systems hide the cursor after a few
// seconds, and the lines should not stay held by something invisible.
const IDLE = 3000;
const door = { open: 0, wanted: false };
const hand = { x: 0, y: 0, tx: 0, ty: 0, on: 0, active: false, mouse: false, moved: 0 };
const REACH_X = COMPACT ? 110 : 160;
const REACH_Y = COMPACT ? 160 : 220;

function aim(e) {
  hand.tx = e.clientX;
  hand.ty = e.clientY;
  if (!hand.on) {
    hand.x = hand.tx;
    hand.y = hand.ty;
  }
}

addEventListener('pointermove', e => {
  aim(e);
  if (e.pointerType === 'mouse') {
    hand.active = hand.mouse = true;
    hand.moved = performance.now();
  }
});
addEventListener('pointerdown', e => {
  aim(e);
  hand.active = true;
});
addEventListener('pointerup', e => {
  if (e.pointerType !== 'mouse') hand.active = false;
});
addEventListener('pointercancel', () => hand.active = false);
document.documentElement.addEventListener('mouseleave', () => hand.active = false);
addEventListener('blur', () => hand.active = false);

// free is where the waves put a line, ys is where it is drawn.
function bend(dt) {
  const follow = 1 - Math.exp(-dt / 250);
  const settle = 1 - Math.exp(-dt / 220);
  hand.x += (hand.tx - hand.x) * follow;
  hand.y += (hand.ty - hand.y) * follow;
  if (hand.mouse && performance.now() - hand.moved > IDLE) hand.active = false;
  hand.on += ((hand.active ? 1 : 0) - hand.on) * (1 - Math.exp(-dt / 600));

  door.open += ((door.wanted ? 1 : 0) - door.open) * (1 - Math.exp(-dt / 700));
  // The door: each line is given a place above or below the clearing,
  // spaced evenly so they lie open instead of piling up at its edge.
  const half = h * (COMPACT ? 0.4 : 0.36), side = LINES / 2;
  const room = h / 2 - half - 24, gapOut = room / side;

  lines.forEach((l, i) => {
    const { free, ys } = l;
    const k = i < side ? side - 1 - i : i - side;
    const rest = h / 2 + (i < side ? -1 : 1) * (half + 12 + k * gapOut);
    for (let j = 0; j < cols; j++) {
      const dx = (j * STEP - hand.x) / REACH_X;
      const dy = hand.y - free[j];
      const pull = hand.on * 0.9 * Math.exp(-dx * dx - (dy / REACH_Y) ** 2);
      let target = free[j] + dy * pull;

      if (door.open > 0.001) {
        const out = rest + (free[j] - (free[0] + free[cols - 1]) / 2) * 0.15;
        target += (out - target) * door.open;
      }
      ys[j] = l.fresh ? target : ys[j] + (target - ys[j]) * settle;
    }
  });
}

// A line is a bundle of burin strokes that swell and taper. The outer
// strokes fade out as the line goes far, and are skipped once invisible.
// All strokes of a line go into one path so they cost a single fill.
function engrave(l) {
  const spread = 0.35 + 2.4 * l.depth;
  const body = 0.1 + 2.2 * l.depth;
  const { ys, sw } = l;

  if (l.depth < 0.55) return hairlines(l, spread, body);

  ctx.beginPath();
  for (let s = 0; s < STRANDS; s++) {
    const pos = s - (STRANDS - 1) / 2;
    const side = Math.abs(pos);
    const fade = side === 0 ? 1 : smooth(0.1 * side, 0.1 * side + 0.15, l.depth);
    if (fade === 0) continue;

    const offset = pos * spread;
    const weight = (1 - side / STRANDS) * body;
    const shift = s * 9;

    ctx.moveTo(0, ys[0] + offset);
    for (let j = 0; j < cols; j++) {
      const v = 0.5 + 0.25 * sw[(j + shift) % cols];
      ctx.lineTo(j * STEP, ys[j] + offset - (0.06 + 0.35 * v * v * weight) * fade);
    }
    for (let j = cols - 1; j >= 0; j--) {
      const v = 0.5 + 0.25 * sw[(j + shift) % cols];
      ctx.lineTo(j * STEP, ys[j] + offset + (0.06 + 0.35 * v * v * weight) * fade);
    }
    ctx.closePath();
  }
  ctx.fill();
}

// Away from the screen the swelling of a stroke is too small to see, so
// those lines are drawn as plain thin strokes, which browsers render far
// faster than thin filled shapes. Strokes with the same weight share a path.
function hairlines(l, spread, body) {
  const { ys } = l;
  ctx.strokeStyle = INK;
  for (let side = 0; side <= (STRANDS - 1) / 2; side++) {
    const fade = side === 0 ? 1 : smooth(0.1 * side, 0.1 * side + 0.15, l.depth);
    if (fade === 0) continue;

    const weight = (1 - side / STRANDS) * body;
    ctx.lineWidth = 2 * (0.06 + 0.1 * weight) * fade;
    ctx.beginPath();
    for (const pos of side === 0 ? [0] : [-side, side]) {
      const offset = pos * spread;
      ctx.moveTo(0, ys[0] + offset);
      for (let j = 1; j < cols; j++) ctx.lineTo(j * STEP, ys[j] + offset);
    }
    ctx.stroke();
  }
}

// Lines far from the screen pass behind the object, near ones in front of
// it. Around the middle a line is drawn on both layers and cross-faded, so
// it never pops from one side to the other.
function draw() {
  backCtx.clearRect(0, 0, w, h);
  frontCtx.clearRect(0, 0, w, h);

  order.sort((a, b) => a.depth - b.depth);
  for (const l of order) {
    const f = smooth(0.42, 0.58, l.depth);
    if (f < 1) stroke(l, backCtx, 1 - f);
    if (f > 0) stroke(l, frontCtx, f);
  }
  backCtx.globalAlpha = frontCtx.globalAlpha = 1;
}

function stroke(l, target, share) {
  ctx = target;
  ctx.fillStyle = INK;
  if (l.depth > 0.3 && target === backCtx) {
    ctx.strokeStyle = DARK;
    ctx.lineWidth = 1 + 11 * l.depth;
    ctx.globalAlpha = 0.5 * share;
    ctx.beginPath();
    for (let j = 0; j < cols; j++) ctx.lineTo(j * STEP, l.ys[j]);
    ctx.stroke();
  }
  ctx.globalAlpha = (0.06 + 0.94 * l.depth ** 1.5) * share;
  engrave(l);
}

// Steps quality down only when the frame rate stays under 45 fps for about
// a second. Long pauses (a hidden tab, a switch of window) are ignored.
// It never steps back up, so it settles instead of flickering.
function adapt(gap) {
  if (++frames < 90 || gap > 250 || level === LEVELS.length - 1) return;
  load = load * 0.98 + (gap > 1000 / 45 * LEVELS[level].every ? 0.02 : 0);
  if (load > 0.6) {
    level++;
    load = 0;
    fit();
  }
}

let tick = 0, pace = 1, slow = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (++tick % LEVELS[level].every) return;

  const gap = t - last, dt = Math.min(gap, 100);
  last = t;
  pace += ((door.wanted ? 0.35 : 1) - pace) * (1 - Math.exp(-dt / 1200));
  slow += dt * pace;
  update(slow, dt * pace);
  draw();
  adapt(gap);
}

lines = Array.from({ length: LINES }, line);
order = lines.slice();
resize();
update(0, 0);

let pending;
addEventListener('resize', () => {
  clearTimeout(pending);
  pending = setTimeout(resize, 150);
});

if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  draw();
} else {
  requestAnimationFrame(frame);
}

const TEXT = {
  en: {
    about: 'About', contact: 'Contact', close: 'Close', soon: 'Coming soon — project in development',

    aboutPage: `<div class="kind">Chi siamo</div><h2>Respiro</h2>

      Laurea triennale in Decorazione — Accademia di Belle Arti di Bologna (2018–2023)</p>`,
    contactPage: `<div class="kind">Contatti</div><h2>Scrivici</h2>
      <p><a href="mailto:progetto-respiro@proton.me">progetto-respiro@proton.me</a></p>`,

};

let WORKS = [];

const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const paras = text => String(text || '').split(/\n\s*\n/).filter(p => p.trim()).map(p => `<p>${esc(p.trim()).replace(/\n/g, '<br>')}</p>`).join('');
const figure = (img, cls) => `<figure class="${cls}"><img src="${esc(img.src)}" alt="${esc(img[lang])}" loading="lazy">${img[lang] ? `<figcaption>${esc(img[lang])}</figcaption>` : ''}</figure>`;

// A work page is built from its data: cut-out objects first, then the text
// and the specs, then photos side by side, then the drawings.
function workPage(w) {
  const t = w[lang] || {};
  const of = type => (w.images || []).filter(i => i.type === type);
  const specs = (w.specs || []).map(s => s[lang] || []).filter(s => s[0] || s[1]);
  const drawings = of('drawing');
  return `<div class="kind">${esc(t.kind)}</div><h2>${esc(w.title)}</h2>
    ${of('object').map(i => figure(i, '')).join('')}
    ${paras(t.text)}
    ${specs.length ? `<dl>${specs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
    ${of('photo').map(i => figure(i, 'wide photo')).join('')}
    ${drawings.length ? `<h3>${TEXT[lang].drawings}</h3>${drawings.map(i => figure(i, 'wide drawing')).join('')}` : ''}
    ${w.soon ? `<p class="soon">${TEXT[lang].soon}</p>` : ''}`;
}

let lang = 'en';
try {
  lang = localStorage.getItem('lang') || (navigator.language.startsWith('it') ? 'it' : 'en');
} catch (e) {}

const stage = document.getElementById('stage');
const caption = document.getElementById('caption');
const doorEl = document.getElementById('door');
const page = document.getElementById('page');
let current = 0, busy = false, obj = null, reading = null;

function words() {
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => (el.textContent = t[el.dataset.t]));
  document.getElementById('close').textContent = t.close;
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
}

function label() {
  const work = WORKS[current];
  caption.innerHTML = `
    <div class="kind">${esc(work[lang]?.kind)}</div>
    <div class="name"><button id="enter">${esc(work.title)}</button></div>
    <div class="nav"><button id="prev" aria-label="Previous">&larr;</button><span class="count">0${current + 1} / 0${WORKS.length}</span><button id="next" aria-label="Next">&rarr;</button></div>`;
  caption.querySelector('#enter').onclick = () => enter(work);
  caption.querySelector('#prev').onclick = () => go(-1);
  caption.querySelector('#next').onclick = () => go(1);
}

function show(i, first) {
  current = (i + WORKS.length) % WORKS.length;
  const work = WORKS[current];
  const el = document.createElement('div');
  el.className = 'obj far';
  const hero = work.hero || (work.images || []).find(i => i.type === 'object')?.src;
  if (hero) el.innerHTML = `<img src="${esc(hero)}" alt="${esc(work.title)}">`;
  el.addEventListener('click', () => enter(work));
  stage.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('far')));
  obj = el;

  caption.style.opacity = 0;
  setTimeout(() => {
    label();
    caption.style.opacity = 1;
  }, first ? 0 : 500);
}

// The current object drifts away into the fog, then the next one comes in.
function go(step) {
  if (busy || door.wanted || WORKS.length < 2) return;
  busy = true;
  const old = obj;
  old.classList.add('far');
  setTimeout(() => {
    old.remove();
    show(current + step);
    setTimeout(() => (busy = false), 600);
  }, 700);
}

function fill() {
  if (reading === 'about') page.innerHTML = TEXT[lang].aboutPage;
  else if (reading === 'contact') page.innerHTML = TEXT[lang].contactPage;
  else page.innerHTML = workPage(reading);
  for (const p of page.querySelectorAll('p')) p.classList.toggle('long', p.textContent.length > 320);
}

function openDoor(what) {
  reading = what;
  fill();
  doorEl.scrollTop = 0;
  door.wanted = true;
  document.body.classList.add('reading');
  doorEl.classList.add('open');
  hand.active = false;
}

const enter = work => openDoor(work);

function closeDoor() {
  door.wanted = false;
  reading = null;
  document.body.classList.remove('reading');
  doorEl.classList.remove('open');
}

document.getElementById('close').onclick = closeDoor;
document.querySelectorAll('[data-page]').forEach(b => (b.onclick = () => openDoor(b.dataset.page)));
document.getElementById('home').onclick = e => {
  e.preventDefault();
  closeDoor();
};
document.querySelectorAll('[data-lang]').forEach(b => (b.onclick = () => {
  lang = b.dataset.lang;
  try {
    localStorage.setItem('lang', lang);
  } catch (e) {}
  words();
  label();
  if (reading) fill();
}));

addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDoor();
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(-1);
});

addEventListener('wheel', e => {
  if (!door.wanted && Math.abs(e.deltaY) + Math.abs(e.deltaX) > 30) go(e.deltaY + e.deltaX > 0 ? 1 : -1);
}, { passive: true });

let swipe = null;
addEventListener('pointerdown', e => e.pointerType !== 'mouse' && !door.wanted && (swipe = { x: e.clientX, y: e.clientY }));
addEventListener('pointerup', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 60) go(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 1 : -1) : (dy < 0 ? 1 : -1));
  swipe = null;
});

// The works live in content.json, which the admin page edits. The query
// string skips the CDN cache so a change shows up as soon as it's published.
words();
fetch('content.json?' + Date.now())
  .then(r => r.json())
  .then(data => {
    WORKS = data.works || [];
    if (WORKS.length) show(0, true);
  });
</script>
